# A complete Druid cluster (every service type plus ZooKeeper, PostgreSQL and Kafka) for exercising and benchmarking a
# Druid image. The same file runs the JVM image and the native image: set DRUID_IMAGE.
#
#   DRUID_IMAGE=druid:native docker compose -p druid-native -f docker-compose.yml up -d
#
# DRUID_DATA_DIR (default: the quickstart tutorial data) is mounted read-only at /opt/data in the task-running
# services for batch ingestion.

name: druid-bench

volumes:
  metadata_data: {}
  druid_shared: {}

x-druid: &druid
  image: ${DRUID_IMAGE:-druid:native}
  env_file:
    - environment
  depends_on:
    - zookeeper
    - postgres

services:
  postgres:
    image: postgres:17.6
    environment:
      - POSTGRES_PASSWORD=FoolishPassword
      - POSTGRES_USER=druid
      - POSTGRES_DB=druid
    volumes:
      - metadata_data:/var/lib/postgresql/data

  zookeeper:
    image: zookeeper:3.9.3
    environment:
      - ZOO_MY_ID=1

  kafka:
    image: apache/kafka:4.1.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  coordinator:
    <<: *druid
    command: [coordinator]
    ports:
      - "18081:8081"
    volumes:
      - druid_shared:/opt/shared
    environment:
      - DRUID_XMX=256m
      - DRUID_XMS=256m
      - DRUID_MAXDIRECTMEMORYSIZE=128m
      - druid_coordinator_asOverlord_enabled=true
      - druid_coordinator_asOverlord_overlordService=druid/overlord
      - druid_coordinator_startDelay=PT5S
      - druid_coordinator_period=PT5S
      - druid_manager_segments_pollDuration=PT5S
      - druid_indexer_queue_startDelay=PT5S
      - druid_indexer_storage_type=metadata
      - druid_indexer_runner_type=httpRemote

  broker:
    <<: *druid
    command: [broker]
    ports:
      - "18082:8082"
    environment:
      - DRUID_XMX=512m
      - DRUID_XMS=512m
      - DRUID_MAXDIRECTMEMORYSIZE=512m
      - druid_broker_http_numConnections=10
      - druid_server_http_numThreads=20
      - druid_processing_buffer_sizeBytes=50000000
      - druid_processing_numMergeBuffers=2
      - druid_processing_numThreads=1
      - druid_sql_planner_metadataRefreshPeriod=PT5S

  historical:
    <<: *druid
    command: [historical]
    ports:
      - "18083:8083"
    volumes:
      - druid_shared:/opt/shared
    environment:
      - DRUID_XMX=512m
      - DRUID_XMS=512m
      - DRUID_MAXDIRECTMEMORYSIZE=768m
      - druid_server_http_numThreads=20
      - druid_processing_buffer_sizeBytes=50000000
      - druid_processing_numMergeBuffers=2
      - druid_processing_numThreads=2
      - druid_segmentCache_locations=[{"path":"/opt/druid/var/druid/segment-cache","maxSize":"2g"}]
      - druid_server_maxSize=2g
      - druid_historical_cache_useCache=true
      - druid_historical_cache_populateCache=true
      - druid_cache_type=caffeine
      - druid_cache_sizeInBytes=20000000

  middlemanager:
    <<: *druid
    command: [middleManager]
    ports:
      - "18091:8091"
    volumes:
      - druid_shared:/opt/shared
      - ${DRUID_DATA_DIR:-../../../../examples/quickstart/tutorial}:/opt/data:ro
    environment:
      - DRUID_XMX=128m
      - DRUID_XMS=128m
      - druid_worker_capacity=2
      - druid_indexer_runner_javaOptsArray=["-Xmx512m","-Xms512m","-XX:MaxDirectMemorySize=512m","-Duser.timezone=UTC","-Dfile.encoding=UTF-8","-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"]
      - druid_indexer_fork_property_druid_processing_buffer_sizeBytes=50000000
      - druid_indexer_fork_property_druid_processing_numMergeBuffers=2
      - druid_indexer_fork_property_druid_processing_numThreads=1

  indexer:
    <<: *druid
    command: [indexer]
    ports:
      - "18092:8092"
    volumes:
      - druid_shared:/opt/shared
      - ${DRUID_DATA_DIR:-../../../../examples/quickstart/tutorial}:/opt/data:ro
    environment:
      - DRUID_XMX=768m
      - DRUID_XMS=768m
      - DRUID_MAXDIRECTMEMORYSIZE=512m
      - druid_plaintextPort=8092
      - druid_worker_capacity=2
      - druid_worker_globalIngestionHeapLimitBytes=200000000
      - druid_processing_buffer_sizeBytes=50000000
      - druid_processing_numMergeBuffers=2
      - druid_processing_numThreads=1

  router:
    <<: *druid
    command: [router]
    ports:
      - "18888:8888"
    environment:
      - DRUID_XMX=128m
      - DRUID_XMS=128m
      - DRUID_MAXDIRECTMEMORYSIZE=64m
      - druid_router_http_numConnections=10
      - druid_router_managementProxy_enabled=true
      - druid_router_sql_enable=true
